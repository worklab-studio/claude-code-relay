# Publish packages/plugin to YOUR private marketplace repo (DESIGN.md §2.3, §3.4). Manual
# trigger only, so forks and the public repo never fail for lack of a secret. To enable it for
# your team: create the marketplace repo, add the repository secret RELAY_PLUGIN_PUSH_TOKEN
# (a fine-grained PAT or GitHub App token with "contents: write" on that repo) and the
# repository variable RELAY_PLUGIN_REPO (e.g. your-org/relay-plugin), then run this workflow
# from the Actions tab — or run `pnpm plugin:publish` locally.
name: publish-plugin

on:
  workflow_dispatch:

concurrency:
  group: publish-plugin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Rebuild and verify the committed bundles
        run: |
          pnpm build
          git diff --exit-code --stat -- packages/plugin/dist || {
            echo "::error::committed bundles differ from a fresh build; refusing to publish"; exit 1; }

      - name: Publish to the marketplace repo
        env:
          RELAY_PLUGIN_REPO: ${{ vars.RELAY_PLUGIN_REPO }}
          RELAY_PLUGIN_PUSH_TOKEN: ${{ secrets.RELAY_PLUGIN_PUSH_TOKEN }}
          GIT_AUTHOR_NAME: relay-publish[bot]
          GIT_AUTHOR_EMAIL: relay-publish@users.noreply.github.com
        run: |
          test -n "$RELAY_PLUGIN_PUSH_TOKEN" || { echo "::error::secret RELAY_PLUGIN_PUSH_TOKEN is not set"; exit 1; }
          test -n "$RELAY_PLUGIN_REPO" || { echo "::error::repository variable RELAY_PLUGIN_REPO is not set (e.g. your-org/relay-plugin)"; exit 1; }
          sh scripts/publish-plugin.sh \
            --dir "$RUNNER_TEMP/relay-plugin" \
            --remote "https://x-access-token:${RELAY_PLUGIN_PUSH_TOKEN}@github.com/${RELAY_PLUGIN_REPO}.git"
